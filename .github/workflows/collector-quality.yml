name: Collector quality suite

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - collector-v11/**
      - docs/**
      - README.md
      - .github/workflows/collector-quality.yml
  pull_request:
    branches:
      - main
    paths:
      - collector-v11/**
      - docs/**
      - README.md
      - .github/workflows/collector-quality.yml
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collector-v11/package-lock.json

      - name: Install locked dependencies
        working-directory: collector-v11
        run: npm ci --no-audit --no-fund

      - name: Run existing Core and AI Foundation tests
        working-directory: collector-v11
        run: npm test

      - name: Run generated Core invariants
        working-directory: collector-v11
        env:
          FC_NUM_RUNS: ${{ github.event_name == 'schedule' && '2500' || '250' }}
        run: npm run test:properties

      - name: Run Core phase 2 regressions and generated sequences
        working-directory: collector-v11
        env:
          FC_NUM_RUNS: ${{ github.event_name == 'schedule' && '1500' || '150' }}
        run: npm run test:core-properties

      - name: Measure Node.js test coverage (informational baseline)
        working-directory: collector-v11
        shell: bash
        run: |
          mkdir -p test-results
          npm run test:coverage > test-results/coverage-report.txt

      - name: Benchmark Replay at 100, 1,000 and 10,000 events
        working-directory: collector-v11
        run: npm run benchmark:replay

      - name: Install Chromium for Playwright
        working-directory: collector-v11
        run: npx playwright install --with-deps chromium

      - name: Install Firefox and WebKit for cross-browser checks
        if: github.event_name == 'schedule' || github.event_name == 'pull_request'
        working-directory: collector-v11
        run: npx playwright install --with-deps firefox webkit

      - name: Run real-browser end-to-end tests
        working-directory: collector-v11
        run: npm run test:e2e

      - name: Run Firefox end-to-end tests
        if: github.event_name == 'schedule' || github.event_name == 'pull_request'
        working-directory: collector-v11
        run: npx playwright test --browser=firefox

      - name: Run WebKit end-to-end tests
        if: github.event_name == 'schedule' || github.event_name == 'pull_request'
        working-directory: collector-v11
        run: npx playwright test --browser=webkit

      - name: Install StrykerJS for nightly mutation testing
        if: github.event_name == 'schedule'
        working-directory: collector-v11
        run: npm install --no-save --no-package-lock @stryker-mutator/core@10.1.1

      - name: Run Core mutation testing (nightly baseline)
        if: github.event_name == 'schedule'
        working-directory: collector-v11
        run: npx stryker run stryker.config.json

      - name: Upload test reports and Replay benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-quality-reports
          path: |
            collector-v11/test-results/coverage-report.txt
            collector-v11/test-results/replay-benchmark.json
            collector-v11/reports/mutation/
            collector-v11/playwright-report/
            collector-v11/test-results/playwright/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collector-playwright-diagnostics
          path: |
            collector-v11/test-results/
            collector-v11/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
