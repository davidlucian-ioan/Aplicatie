name: Collector quality suite

on:
  push:
    branches:
      - feature/collector-testing-automation
    paths:
      - collector-v11/**
      - .github/workflows/collector-quality.yml
  pull_request:
    branches:
      - main
    paths:
      - collector-v11/**
      - .github/workflows/collector-quality.yml
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned dependencies and persist lockfile
        shell: bash
        run: |
          set -euo pipefail
          if [ -f collector-v11/package-lock.json ]; then
            cd collector-v11
            npm ci --no-audit --no-fund
          else
            if [ "$GITHUB_EVENT_NAME" != "push" ]; then
              echo "package-lock.json is missing; it must be generated by the feature-branch push first."
              exit 1
            fi
            cd collector-v11
            npm install --no-audit --no-fund
            cd ..
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add collector-v11/package-lock.json
            if ! git diff --cached --quiet; then
              git commit -m "build: lock Collector test dependencies"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          fi

      - name: Run existing Core and AI Foundation tests
        working-directory: collector-v11
        run: npm test

      - name: Run generated stock/replay properties
        working-directory: collector-v11
        env:
          FC_NUM_RUNS: ${{ github.event_name == 'schedule' && '2500' || '250' }}
        run: npm run test:properties

      - name: Install Chromium for Playwright
        working-directory: collector-v11
        run: npx playwright install --with-deps chromium

      - name: Run real-browser end-to-end tests
        working-directory: collector-v11
        run: npm run test:e2e

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collector-playwright-diagnostics
          path: |
            collector-v11/test-results/
            collector-v11/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
