name: Collector mobile build

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - collector-v11/**
      - .github/workflows/collector-mobile-build.yml
  pull_request:
    branches:
      - main
    paths:
      - collector-v11/**
      - .github/workflows/collector-mobile-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install project dependencies
        working-directory: collector-v11
        run: npm ci --no-audit --no-fund
      - name: Install Capacitor 8 toolchain
        working-directory: collector-v11
        run: npm install --no-save --no-package-lock --no-audit --no-fund @capacitor/core@8.6.2 @capacitor/cli@8.6.2 @capacitor/android@8.6.2 @capacitor/local-notifications@8.3.1
      - name: Verify app and native plugin wiring
        working-directory: collector-v11
        run: npm test
      - name: Build allowlisted web bundle
        working-directory: collector-v11
        run: npm run mobile:build
      - name: Generate Android native project
        working-directory: collector-v11
        run: npx cap add android
      - name: Sync Android native project
        working-directory: collector-v11
        run: npx cap sync android
      - name: Build Android debug APK
        working-directory: collector-v11
        run: cd android && ./gradlew assembleDebug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: collector-android-debug
          path: collector-v11/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS simulator build
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select Xcode
        run: xcodebuild -version
      - name: Install project dependencies
        working-directory: collector-v11
        run: npm ci --no-audit --no-fund
      - name: Install Capacitor 8 toolchain
        working-directory: collector-v11
        run: npm install --no-save --no-package-lock --no-audit --no-fund @capacitor/core@8.6.2 @capacitor/cli@8.6.2 @capacitor/ios@8.6.2 @capacitor/local-notifications@8.3.1
      - name: Verify app and native plugin wiring
        working-directory: collector-v11
        run: npm test
      - name: Build allowlisted web bundle
        working-directory: collector-v11
        run: npm run mobile:build
      - name: Generate iOS native project
        working-directory: collector-v11
        run: npx cap add ios
      - name: Sync iOS native project
        working-directory: collector-v11
        run: npx cap sync ios
      - name: Build iOS simulator app
        working-directory: collector-v11
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - name: Package iOS simulator app
        working-directory: collector-v11
        run: ditto -c -k --sequesterRsrc --keepParent ios/build/Build/Products/Debug-iphonesimulator/App.app collector-ios-simulator.zip
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: collector-ios-simulator
          path: collector-v11/collector-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
