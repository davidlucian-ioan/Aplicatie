name: Collector Android build

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - collector-v11/**
      - .github/workflows/android-build.yml
  pull_request:
    branches:
      - main
    paths:
      - collector-v11/**
      - .github/workflows/android-build.yml

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: collector-v11/package-lock.json

      - name: Install locked dependencies
        working-directory: collector-v11
        run: npm ci --no-audit --no-fund

      - name: Verify Android WebView bundle generation
        working-directory: collector-v11
        run: npm run build:android:web

      - name: Generate Capacitor Android project and apply native permissions
        working-directory: collector-v11
        run: npm run android:add

      - name: Build Android debug APK
        working-directory: collector-v11/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: collector-android-debug
          path: collector-v11/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
